name: Sync from Canva

on:
  schedule:
    - cron: '0 * * * *'      # every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canva-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Pull from Canva
        env:
          CANVA_CLIENT_ID:     ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          CANVA_DESIGN_ID:     ${{ secrets.CANVA_DESIGN_ID }}
        run: node scripts/sync.mjs

      - name: Rotate refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -f .new-refresh-token ]; then
            gh secret set CANVA_REFRESH_TOKEN \
              --body "$(cat .new-refresh-token)" \
              --repo ${{ github.repository }}
            rm .new-refresh-token
          fi

      - name: Heartbeat (keeps repo active so GitHub never auto-disables the schedule)
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-checked

      - name: Commit
        run: |
          git config user.name  "canva-bot"
          git config user.email "canva-bot@users.noreply.github.com"
          git add -A
          rm -f .changed
          git diff --staged --quiet || git commit -m "Sync guide from Canva / heartbeat"
          git push
